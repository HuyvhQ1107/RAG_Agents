[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-agents-backend"
version = "0.1.0"
description = "Bilingual Internal Document Q&A with Query-Understanding Agent & Grounded RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "pgvector>=0.3.5",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "langgraph>=0.2.35",
    "litellm>=1.50.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
full = [
    "docling>=2.5.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "procrastinate>=2.13.0",
    "boto3>=1.35.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "testcontainers[postgres]>=4.8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["src", "../eval/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
