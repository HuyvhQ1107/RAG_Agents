        body: "Định mức công tác phí: Công tác trong nước được hưởng phụ cấp lưu trú 500.000 VNĐ/ngày và khách sạn tối đa 1.500.000 VNĐ/đêm. Công tác nước ngoài được hưởng phụ cấp 80 USD/ngày tại khu vực Đông Nam Á và 120 USD/ngày tại các khu vực khác."
