    sections:
      - heading: "Điều 4: Số ngày nghỉ phép năm"
        body: "Nhân viên chính thức làm việc đủ 12 tháng được hưởng 12 ngày nghỉ phép năm hưởng nguyên lương. Cứ mỗi 5 năm thâm niên làm việc tại công ty, nhân viên được cộng thêm 1 ngày phép năm. Đối với các trường hợp ngoại lệ, vui lòng liên hệ phòng Nhân sự (HR) để được hướng dẫn."
      - heading: "Điều 6: Nhân viên thử việc & Nghỉ không lương"
        body: "Trong thời gian thử việc (tối đa 2 tháng), nhân viên thử việc chưa được tính phép năm riêng mà sẽ được cộng dồn sau khi ký hợp đồng chính thức. Nhân viên chính thức có thể xin nghỉ không lương tối đa 15 ngày/năm khi được trưởng bộ phận phê duyệt."
